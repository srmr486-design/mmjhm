    let svg, g, zoom, rootHierarchy, treeLayout;
    let selectedNode = null;
    let width = window.innerWidth;
    let height = window.innerHeight - 65;

    const container = document.getElementById("mindmap-container");
    const svgElement = d3.select("#mindmap-svg");

    function initMindmap() {
      svgElement.selectAll("*").remove();

      width = container.clientWidth || window.innerWidth;
      height = container.clientHeight || (window.innerHeight - 65);

      svg = svgElement
        .attr("width", width)
        .attr("height", height)
        .attr("viewBox", [0, 0, width, height]);

      const defs = svg.append("defs");

      // Shadow filter
      const filter = defs.append("filter")
        .attr("id", "node-shadow")
        .attr("x", "-20%")
        .attr("y", "-20%")
        .attr("width", "140%")
        .attr("height", "140%");
      filter.append("feDropShadow")
        .attr("dx", "0")
        .attr("dy", "5")
        .attr("stdDeviation", "6")
        .attr("flood-color", "#0f172a")
        .attr("flood-opacity", "0.1");

      g = svg.append("g").attr("class", "mindmap-main-group");

      zoom = d3.zoom()
        .scaleExtent([0.15, 3.0])
        .on("zoom", (event) => {
          g.attr("transform", event.transform);
        });

      svg.call(zoom).on("dblclick.zoom", null);

      // Node sizing & tree layout spacing (첫 노드 및 3단계 노드 길이에 맞게 가로 간격 넉넉히 배분)
      treeLayout = d3.tree()
        .nodeSize([130, 480])
        .separation((a, b) => (a.parent === b.parent ? 1.25 : 1.45));

      rootHierarchy = d3.hierarchy(mindmapData);
      rootHierarchy.x0 = height / 2;
      rootHierarchy.y0 = 0;

      // 요청사항: 처음에는 루트 노드만 보이고 그 아래의 모든 하위 노드가 완전히 닫혀있도록 설정
      function collapseAll(d) {
        if (d.children) {
          d._children = d.children;
          d._children.forEach(collapseAll);
          d.children = null;
        }
      }
      // 최상위 노드의 자식들(교사프로그램, 학생프로그램 등)을 모두 접음
      collapseAll(rootHierarchy);

      update(rootHierarchy);
      resetToCenter(false);
    }

    function getNodeCardDimensions(d) {
      const isRoot = d.depth === 0;
      const isLevel1 = d.depth === 1;
      // 첫 노드는 한 줄에 글자가 큼직하게 들어가도록 너비를 460으로 확대
      const cardWidth = isRoot ? 460 : (isLevel1 ? 300 : 380);
      const cardHeight = isRoot ? 96 : (isLevel1 ? 84 : 84);
      return { cardWidth, cardHeight };
    }

    function update(source) {
      const treeData = treeLayout(rootHierarchy);
      const nodes = treeData.descendants();
      const links = treeData.links();

      // Horizontal depth distance
      nodes.forEach(d => {
        d.y = d.depth * 480;
      });

      // ================== LINKS ==================
      const link = g.selectAll(".mindmap-link")
        .data(links, d => d.target.data.id);

      const linkEnter = link.enter()
        .append("path")
        .attr("class", "mindmap-link")
        .attr("id", d => `link-${d.target.data.id}`)
        .attr("d", d => {
          const o = { x: source.x0 || 0, y: source.y0 || 0, depth: source.depth || 0 };
          return diagonal({ source: o, target: o });
        });

      link.merge(linkEnter)
        .transition().duration(400)
        .attr("d", d => diagonal(d));

      link.exit()
        .transition().duration(350)
        .attr("d", d => {
          const o = { x: source.x, y: source.y, depth: source.depth };
          return diagonal({ source: o, target: o });
        })
        .remove();

      // ================== NODES ==================
      const node = g.selectAll(".mindmap-node")
        .data(nodes, d => d.data.id);

      const nodeEnter = node.enter()
        .append("g")
        .attr("class", "mindmap-node cursor-pointer")
        .attr("id", d => `node-g-${d.data.id}`)
        .attr("transform", d => `translate(${source.y0 || 0}, ${source.x0 || 0})`)
        .on("click", (event, d) => {
          event.stopPropagation();
          handleNodeClick(d);
        });

      // Background Card
      nodeEnter.append("rect")
        .attr("class", "node-card-bg transition-all duration-200")
        .attr("rx", 20)
        .attr("ry", 20)
        .attr("filter", "url(#node-shadow)");

      // Left Accent Strip
      nodeEnter.append("rect")
        .attr("class", "node-accent-bar")
        .attr("rx", 4)
        .attr("ry", 4);

      // ForeignObject for Large Typography
      const foreign = nodeEnter.append("foreignObject")
        .attr("class", "node-foreign-content")
        .style("overflow", "visible");

      foreign.append("xhtml:div")
        .attr("class", "node-html-box w-full h-full flex items-center pr-4 pointer-events-none");

      // Collapse / Expand toggle button (indicator)
      const toggleBtn = nodeEnter.append("g")
        .attr("class", "node-toggle-btn cursor-pointer");

      toggleBtn.append("circle")
        .attr("r", 15)
        .attr("fill", "#ffffff")
        .attr("stroke", "#475569")
        .attr("stroke-width", 2.2);

      toggleBtn.append("text")
        .attr("text-anchor", "middle")
        .attr("dy", "5px")
        .attr("font-size", "17px")
        .attr("font-weight", "900")
        .attr("fill", "#1e293b")
        .text(d => (d._children ? "+" : "−"));

      // ================== NODE UPDATE ==================
      const nodeUpdate = node.merge(nodeEnter);

      nodeUpdate.transition().duration(400)
        .attr("transform", d => `translate(${d.y}, ${d.x})`);

      nodeUpdate.each(function(d) {
        const el = d3.select(this);
        const isRoot = d.depth === 0;
        const isLevel1 = d.depth === 1;
        const hasChildren = Boolean(d.children || d._children);
        const { cardWidth, cardHeight } = getNodeCardDimensions(d);

        const isSelected = selectedNode && selectedNode.data.id === d.data.id;

        // Card background
        el.select(".node-card-bg")
          .attr("x", -15)
          .attr("y", -cardHeight / 2)
          .attr("width", cardWidth)
          .attr("height", cardHeight)
          .attr("fill", isSelected ? "#eff6ff" : "#ffffff")
          .attr("stroke", isSelected ? d.data.color : (isRoot ? "#2563eb" : "#cbd5e1"))
          .attr("stroke-width", isSelected ? 3.5 : (isRoot ? 3 : 1.8));

        // Accent strip
        el.select(".node-accent-bar")
          .attr("x", -15)
          .attr("y", -cardHeight / 2)
          .attr("width", 8)
          .attr("height", cardHeight)
          .attr("fill", d.data.color);

        // Foreign content area
        el.select(".node-foreign-content")
          .attr("x", -5)
          .attr("y", -cardHeight / 2)
          .attr("width", cardWidth - 10)
          .attr("height", cardHeight);

        // Large fonts & icons
        const iconSize = isRoot ? "w-14 h-14 text-2xl" : (isLevel1 ? "w-12 h-12 text-xl" : "w-11 h-11 text-lg");
        // 첫 노드는 한 줄로 큼직하고 굵게 표시
        const titleSize = isRoot ? "text-[23px] font-black tracking-tight" : (isLevel1 ? "text-xl font-black" : "text-lg font-bold");
        const badgeSize = "text-[12px] font-semibold text-blue-600";

        const badgeHtml = d.data.badge ? `<span class="${badgeSize} tracking-tight leading-none mb-1 block">${d.data.badge}</span>` : '';

        const htmlBox = el.select(".node-html-box");
        htmlBox.html(`
          <div class="flex items-center gap-3.5 w-full pl-2">
            <div class="${iconSize} rounded-xl flex items-center justify-center flex-shrink-0 text-white shadow-md" style="background-color: ${d.data.color};">
              <i class="fa-solid ${d.data.icon}"></i>
            </div>
            <div class="flex flex-col min-w-0 pr-1 justify-center">
              ${badgeHtml}
              <span class="${titleSize} text-slate-900 whitespace-nowrap leading-snug">${d.data.name}</span>
            </div>
          </div>
        `);

        // Toggle button positioning & state
        const toggle = el.select(".node-toggle-btn");
        if (hasChildren) {
          toggle.style("display", "block")
            .attr("transform", `translate(${cardWidth - 15}, 0)`);
          toggle.select("text")
            .text(d._children ? "+" : "−");
        } else {
          toggle.style("display", "none");
        }
      });

      const nodeExit = node.exit()
        .transition().duration(350)
        .attr("transform", d => `translate(${source.y}, ${source.x})`)
        .remove();

      nodeExit.select("rect").attr("opacity", 0);

      nodes.forEach(d => {
        d.x0 = d.x;
        d.y0 = d.y;
      });
    }

    function diagonal(d) {
      const sourceDims = getNodeCardDimensions(d.source);
      const sourceCardWidth = sourceDims.cardWidth - 15;
      return `M ${d.source.y + sourceCardWidth} ${d.source.x}
              C ${(d.source.y + d.target.y) / 2 + 50} ${d.source.x},
                ${(d.source.y + d.target.y) / 2 - 50} ${d.target.x},
                ${d.target.y - 15} ${d.target.x}`;
    }

    function toggleChildren(d) {
      if (d.children) {
        d._children = d.children;
        d.children = null;
        return "closed";
      } else if (d._children) {
        d.children = d._children;
        d._children = null;
        return "opened";
      }
      return "leaf";
    }

    /**
     * 상위 노드와 하위 노드(자식들) 전체를 화면에 가장 크게 꽉 채워 보여주는 스마트 줌 & 포커스
     */
    function focusUpperAndLowerMaximally(parentD, targetD) {
      // 포커싱할 노드 집합 결정 (상위 노드 + 하위 노드들)
      let relatedNodes = [];

      if (targetD.children && targetD.children.length > 0) {
        // 방금 펼쳐진 노드와 그 직속 하위 자식들을 모두 포함
        relatedNodes = [targetD, ...targetD.children];
        if (targetD.parent) relatedNodes.push(targetD.parent);
      } else if (targetD.parent) {
        // 단말 노드이거나 접힌 상태인 경우: 부모와 그 노드를 포커스
        relatedNodes = [targetD.parent, targetD];
      } else {
        // 루트 노드 단독 (화면 중앙에 꽉 차게)
        resetToCenter(true);
        return;
      }

      // 노드들의 전체 좌표 경계(Bounding Box) 계산
      let minX = Infinity, maxX = -Infinity;
      let minY = Infinity, maxY = -Infinity;

      relatedNodes.forEach(node => {
        const { cardWidth, cardHeight } = getNodeCardDimensions(node);
        const top = node.x - cardHeight / 2;
        const bottom = node.x + cardHeight / 2;
        const left = node.y - 15;
        const right = node.y + cardWidth;

        if (top < minX) minX = top;
        if (bottom > maxX) maxX = bottom;
        if (left < minY) minY = left;
        if (right > maxY) maxY = right;
      });

      const boxWidth = maxY - minY;   // D3 가로
      const boxHeight = maxX - minX;  // D3 세로

      // 우측 배너(약 420px)가 열릴 공간을 고려하여 가용 너비 및 중심점 계산
      const isMobile = width < 768;
      const rightReserved = isMobile ? 0 : 430;
      const availableWidth = Math.max(300, width - rightReserved);

      const padding = 60; // 화면에 큼직하게 꽉 차도록 여백 조정
      const scaleX = (availableWidth - padding * 2) / boxWidth;
      const scaleY = (height - padding * 2) / boxHeight;
      let targetScale = Math.min(scaleX, scaleY);

      // 너무 과도한 확대나 축소를 방지하면서도 화면 가득 시원하게
      targetScale = Math.max(0.65, Math.min(targetScale, 1.45));

      const centerBoxY = (minY + maxY) / 2;
      const centerBoxX = (minX + maxX) / 2;

      // 가용 너비 중앙에 위치하도록 translateX 산출
      const targetCenterScreenX = availableWidth / 2;
      const translateX = targetCenterScreenX - (centerBoxY * targetScale);
      const translateY = (height / 2) - (centerBoxX * targetScale);

      const transform = d3.zoomIdentity
        .translate(translateX, translateY)
        .scale(targetScale);

      svg.transition()
        .duration(650)
        .ease(d3.easeCubicOut)
        .call(zoom.transform, transform);

      // 연결 링크 강조
      d3.selectAll(".mindmap-link").classed("highlighted", false);
      if (targetD.parent) {
        d3.select(`#link-${targetD.data.id}`).classed("highlighted", true);
      }
    }

    /**
     * 우측 정보 배너 업데이트 및 표시 함수
     */
    function showInfoBanner(d) {
      const banner = document.getElementById("info-banner");
      const titleEl = document.getElementById("banner-title");
      const badgeEl = document.getElementById("banner-badge");
      const descEl = document.getElementById("banner-desc");
      const iconEl = document.getElementById("banner-icon");
      const iconBoxEl = document.getElementById("banner-icon-box");
      const pointsEl = document.getElementById("banner-points");

      titleEl.innerText = d.data.name;
      badgeEl.innerText = d.data.badge || (d.depth === 0 ? "최상위 주제" : "프로그램 트랙");
      descEl.innerText = d.data.desc || "상세 교육 내용입니다.";

      iconEl.className = `fa-solid ${d.data.icon}`;
      iconBoxEl.style.backgroundColor = d.data.color;

      // 핵심 포인트 항목 렌더링
      const points = d.data.points || [];
      if (points.length > 0) {
        pointsEl.innerHTML = points.map((pt, idx) => {
          const isCaseStudy = d.data.id === "t-5" && pt.includes("에듀테크를 활용 사례");
          return `
            <div class="${isCaseStudy ? 'cursor-pointer hover:bg-blue-50/80 border-blue-200 bg-blue-50/40' : 'bg-slate-50 border-slate-200'} flex items-start gap-3.5 p-4 rounded-xl border hover:border-blue-300 transition shadow-xs group"
                 ${isCaseStudy ? 'onclick="openMediaModal()"' : ''}>
              <span class="w-8 h-8 rounded-lg ${isCaseStudy ? 'bg-blue-600 ring-2 ring-blue-300' : 'bg-blue-600'} text-white font-black text-base flex items-center justify-center flex-shrink-0 shadow-sm mt-0.5">
                ${idx + 1}
              </span>
              <div class="flex-1">
                <span class="text-base font-bold text-slate-900 leading-snug break-keep flex items-center justify-between">
                  <span>${pt}</span>
                  ${isCaseStudy ? '<span class="text-xs font-semibold px-2 py-0.5 rounded-full bg-blue-600 text-white flex items-center gap-1 shadow-xs ml-2 flex-shrink-0"><i class="fa-regular fa-image"></i> 자료 보기</span>' : ''}
                </span>
                ${isCaseStudy ? '<p class="text-xs text-blue-600 font-medium mt-1">클릭하면 에듀테크 적용 사례 1, 2, 3이 차례대로 크게 열립니다.</p>' : ''}
              </div>
            </div>
          `;
        }).join("");
      } else {
        pointsEl.innerHTML = `
          <div class="text-sm text-slate-400 p-4 bg-slate-50 rounded-xl">
            등록된 세부 내용이 없습니다.
          </div>
        `;
      }

      // 배너 슬라이드 인
      banner.classList.remove("translate-x-[115%]");
    }

    function hideInfoBanner() {
      const banner = document.getElementById("info-banner");
      banner.classList.add("translate-x-[115%]");
    }

    // ================== 에듀테크 활용 사례 모달 갤러리 로직 ==================
    const mediaCases = [
      {
        type: "image",
        title: "에듀테크 활용 사례 1: 교실 수업 적용 예시",
        url: "https://cdnweb01.wikitree.co.kr/webdata/editor/202012/04/img_20201204133951_7c6a315f.webp"
      },
      {
        type: "image",
        title: "에듀테크 활용 사례 2: 학생 활동 및 결과물",
        url: "https://postfiles.pstatic.net/MjAyNDEwMjVfMTk2/MDAxNzI5ODM1NjAwMTkw.pJWc8YYEqBjFCPvgF8AwaiddwuMNpdwH75gyAKnDyDMg.sTwZDA-62K6POURSsqfwbqm8aKHpI2LTg8HxpekR6fEg.JPEG/1729834905236.jpg?type=w773"
      },
      {
        type: "link",
        title: "에듀테크 활용 사례 3: 구글 드라이브 자료 폴더",
        url: "https://drive.google.com/drive/u/1/folders/1drXtFQ8T8tv0IxPGpoUknfXVbgU2suOR"
      }
    ];

    let currentMediaIndex = 0;

    function renderMediaModal(index) {
      currentMediaIndex = (index + mediaCases.length) % mediaCases.length;
      const cur = mediaCases[currentMediaIndex];

      document.getElementById("modal-step-indicator").innerText = `${currentMediaIndex + 1} / ${mediaCases.length}`;
      document.getElementById("modal-item-title").innerText = cur.title;

      const imgEl = document.getElementById("modal-img");
      const driveBox = document.getElementById("modal-drive-box");
      const driveLink = document.getElementById("modal-drive-link");

      if (cur.type === "image") {
        imgEl.classList.remove("hidden");
        driveBox.classList.add("hidden");
        imgEl.src = cur.url;
      } else {
        imgEl.classList.add("hidden");
        driveBox.classList.remove("hidden");
        driveLink.href = cur.url;
      }

      // 스텝 도트 강조
      const dots = document.querySelectorAll(".step-dot");
      dots.forEach((dot, idx) => {
        if (idx === currentMediaIndex) {
          dot.className = "step-dot w-6 h-2.5 rounded-full bg-blue-600 transition-all";
        } else {
          dot.className = "step-dot w-2.5 h-2.5 rounded-full bg-slate-300 transition-all";
        }
      });
    }

    function openMediaModal() {
      const modal = document.getElementById("media-modal");
      modal.classList.remove("hidden", "pointer-events-none");
      requestAnimationFrame(() => {
        modal.classList.remove("opacity-0");
        modal.classList.add("opacity-100");
      });
      renderMediaModal(0);
    }

    function closeMediaModal() {
      const modal = document.getElementById("media-modal");
      modal.classList.remove("opacity-100");
      modal.classList.add("opacity-0");
      setTimeout(() => {
        modal.classList.add("hidden", "pointer-events-none");
      }, 300);
    }

    function handleNodeClick(d) {
      selectedNode = d;

      // 1. 노드 클릭 시 하위 항목을 열고 닫음
      toggleChildren(d);

      // 2. 우측 배너 노출 조건: 첫 번째 레벨(depth === 0) 및 두 번째 레벨(depth === 1)은 배너 표시 제외
      if (d.depth >= 2) {
        showInfoBanner(d);
      } else {
        hideInfoBanner();
      }

      // 3. 트리 재배치 및 렌더링
      update(d);

      // 4. 상위 항목과 하위 항목이 둘 다 가장 크게 보일 수 있도록 자동 포커싱 & 줌
      const parentNode = d.parent || d;
      focusUpperAndLowerMaximally(parentNode, d);
    }

    function resetToCenter(animate = true) {
      // 초기 첫 노드가 화면 정중앙에 크고 시원하게 꽉 차서 보이도록 센터링
      const { cardWidth } = getNodeCardDimensions(rootHierarchy);
      const initialScale = width < 768 ? 1.0 : 1.35;
      const initialX = (width / 2) - ((cardWidth / 2) * initialScale);
      const initialY = height / 2;

      const transform = d3.zoomIdentity
        .translate(initialX, initialY)
        .scale(initialScale);

      if (animate) {
        svg.transition().duration(600).ease(d3.easeCubicOut).call(zoom.transform, transform);
      } else {
        svg.call(zoom.transform, transform);
      }
      selectedNode = null;
      hideInfoBanner();
      d3.selectAll(".mindmap-link").classed("highlighted", false);
    }

    document.addEventListener("DOMContentLoaded", () => {
      initMindmap();

      window.addEventListener("resize", () => {
        width = container.clientWidth || window.innerWidth;
        height = container.clientHeight || (window.innerHeight - 65);
        svg.attr("width", width).attr("height", height);
        if (selectedNode) {
          focusUpperAndLowerMaximally(selectedNode.parent || selectedNode, selectedNode);
        } else {
          resetToCenter(false);
        }
      });

      document.getElementById("btnZoomIn").addEventListener("click", () => {
        svg.transition().duration(300).call(zoom.scaleBy, 1.3);
      });

      document.getElementById("btnZoomOut").addEventListener("click", () => {
        svg.transition().duration(300).call(zoom.scaleBy, 0.75);
      });

      document.getElementById("btnResetView").addEventListener("click", () => {
        resetToCenter(true);
      });

      // 우측 배너 닫기 버튼 이벤트
      document.getElementById("banner-close-btn").addEventListener("click", () => {
        hideInfoBanner();
      });

      // 미디어 모달 관련 이벤트 바인딩
      const modalArea = document.getElementById("modal-content-area");
      const modalCloseBtn = document.getElementById("modal-close-btn");
      const modalPrevBtn = document.getElementById("modal-prev-btn");
      const modalNextBtn = document.getElementById("modal-next-btn");
      const mediaModal = document.getElementById("media-modal");

      modalCloseBtn.addEventListener("click", (e) => {
        e.stopPropagation();
        closeMediaModal();
      });

      modalPrevBtn.addEventListener("click", (e) => {
        e.stopPropagation();
        renderMediaModal(currentMediaIndex - 1);
      });

      modalNextBtn.addEventListener("click", (e) => {
        e.stopPropagation();
        renderMediaModal(currentMediaIndex + 1);
      });

      // 모달 화면(본문)을 클릭하면 차례대로 다음 그림/링크로 이동
      modalArea.addEventListener("click", (e) => {
        // 드라이브 링크 버튼 자체를 클릭한 경우 제외
        if (e.target.closest("#modal-drive-link")) return;
        renderMediaModal(currentMediaIndex + 1);
      });

      // 배경 딤 클릭 시 모달 닫기
      mediaModal.addEventListener("click", (e) => {
        if (e.target === mediaModal) {
          closeMediaModal();
        }
      });

      // 키보드 방향키 및 ESC 지원
      window.addEventListener("keydown", (e) => {
        if (!mediaModal.classList.contains("hidden")) {
          if (e.key === "Escape") closeMediaModal();
          if (e.key === "ArrowRight" || e.key === " ") renderMediaModal(currentMediaIndex + 1);
          if (e.key === "ArrowLeft") renderMediaModal(currentMediaIndex - 1);
        }
      });

      let allExpanded = false;
      document.getElementById("btnToggleAll").addEventListener("click", () => {
        allExpanded = !allExpanded;
        const toggleAllHelper = (node) => {
          if (!allExpanded) {
            if (node.children) {
              node._children = node.children;
              node.children = null;
            }
          } else {
            if (node._children) {
              node.children = node._children;
              node._children = null;
            }
          }
          const list = node.children || node._children;
          if (list) list.forEach(toggleAllHelper);
        };

        toggleAllHelper(rootHierarchy);
        if (!allExpanded && rootHierarchy._children) {
          rootHierarchy.children = rootHierarchy._children;
          rootHierarchy._children = null;
        }

        update(rootHierarchy);
        document.getElementById("btnToggleAllText").innerText = allExpanded ? "모두 접기" : "모두 펼치기";
        resetToCenter(true);
      });

      svgElement.on("click", (event) => {
        if (event.target.tagName === "svg" || event.target.classList.contains("mindmap-main-group")) {
          selectedNode = null;
          hideInfoBanner();
          d3.selectAll(".mindmap-link").classed("highlighted", false);
          update(rootHierarchy);
        }
      });
    });
  </script>
</body>
</html>
